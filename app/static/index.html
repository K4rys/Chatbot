<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant SGO IMMO</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6a66;
    --accent: #1f4e79; --accent-text: #ffffff; --border: #e2e0da; --user: #e8eef5; --warn: #9a3b1b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151514; --surface: #1f1f1d; --text: #ecebe7; --muted: #a09e98;
      --accent: #7fb0e0; --accent-text: #0e1a26; --border: #34332f; --user: #22303e; --warn: #f0a080;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151514; --surface: #1f1f1d; --text: #ecebe7; --muted: #a09e98;
    --accent: #7fb0e0; --accent-text: #0e1a26; --border: #34332f; --user: #22303e; --warn: #f0a080;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
  header .wrap { max-width: 820px; margin: 0 auto; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  #fil { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { padding: 12px 16px; border-radius: 12px; max-width: 100%; overflow-wrap: anywhere; }
  .msg.client { background: var(--user); align-self: flex-end; max-width: 85%; white-space: pre-wrap; }
  .msg.assistant { background: var(--surface); border: 1px solid var(--border); }
  .msg.assistant table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 14px; }
  .msg.assistant th, .msg.assistant td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
  .msg.assistant blockquote { margin: 8px 0; padding-left: 12px; border-left: 3px solid var(--border); color: var(--muted); }
  .msg.assistant p:first-child { margin-top: 0; } .msg.assistant p:last-child { margin-bottom: 0; }
  .status { color: var(--muted); font-size: 14px; font-style: italic; }
  .erreur { color: var(--warn); }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; }
  .suggestions button { background: var(--surface); color: var(--text); border: 1px solid var(--border);
                        border-radius: 14px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; text-align: left; }
  .suggestions button:hover { border-color: var(--accent); }
  footer { border-top: 1px solid var(--border); background: var(--surface); padding: 12px 16px; }
  form { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; min-height: 48px; max-height: 200px; padding: 12px; font: inherit;
             border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  button.envoyer { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 10px;
                   padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .mention { max-width: 820px; margin: 8px auto 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>SGO IMMO</h1>
  <p id="sous-titre">Assistant virtuel (IA) · disponible 24 h/24</p>
</div></header>

<main id="zone"><div id="fil">
  <div class="msg assistant" id="accueil"></div>
  <div class="suggestions" id="suggestions">
    <button>J'ai repéré un appartement de 120 m² à 520 000 €, 90 000 € de travaux, revente visée 6 500 €/m² en 12 mois. Est-ce que ça tient ?</button>
    <button>Quel prix maximum puis-je proposer pour garder 15 % de marge ?</button>
    <button>Quels points vérifier dans ma promesse avant de signer ?</button>
    <button>Vente en bloc ou découpe : comment choisir ma stratégie de sortie ?</button>
  </div>
</div></main>

<footer>
  <form id="formulaire">
    <textarea id="saisie" rows="1" placeholder="Votre question…" maxlength="6000"></textarea>
    <button class="envoyer" type="submit" id="bouton">Envoyer</button>
  </form>
  <p class="mention">Assistant IA : avis opérationnel et économique, non vérifié, qui ne constitue ni une consultation
  juridique ou fiscale, ni une expertise, ni une recommandation d'investissement. La décision finale vous appartient.</p>
</footer>

<script>
const fil = document.getElementById('fil'), zone = document.getElementById('zone');
const saisie = document.getElementById('saisie'), bouton = document.getElementById('bouton');
let conversationId = null;
try { conversationId = sessionStorage.getItem('sgo_conv'); } catch (e) {}

// Rendu Markdown minimal : tout le HTML est échappé avant mise en forme (pas d'injection possible).
const esc = (t) => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const inline = (t) => esc(t)
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>')
  .replace(/(^|\W)_([^_\n]+)_(?!\w)/g, '$1<em>$2</em>');
function rendu(md) {
  const lignes = md.replace(/\r/g, '').split('\n'); let html = '', i = 0;
  const cellules = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  while (i < lignes.length) {
    const l = lignes[i];
    if (!l.trim()) { i++; continue; }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { const n = Math.min(m[1].length + 2, 6); html += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if (/^\s*(---|\*\*\*)\s*$/.test(l)) { html += '<hr>'; i++; continue; }
    if (l.trim().startsWith('|') && i + 1 < lignes.length && /^\s*\|?\s*:?-{2,}/.test(lignes[i + 1])) {
      html += '<table><thead><tr>' + cellules(l).map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lignes.length && lignes[i].trim().startsWith('|')) {
        html += '<tr>' + cellules(lignes[i]).map(c => `<td>${inline(c)}</td>`).join('') + '</tr>'; i++;
      }
      html += '</tbody></table>'; continue;
    }
    if (/^\s*([-*•]|\d+[.)])\s+/.test(l)) {
      const ordonnee = /^\s*\d/.test(l); html += ordonnee ? '<ol>' : '<ul>';
      while (i < lignes.length && /^\s*([-*•]|\d+[.)])\s+/.test(lignes[i])) {
        html += `<li>${inline(lignes[i].replace(/^\s*([-*•]|\d+[.)])\s+/, ''))}</li>`; i++;
      }
      html += ordonnee ? '</ol>' : '</ul>'; continue;
    }
    if (l.startsWith('>')) { html += `<blockquote>${inline(l.replace(/^>\s?/, ''))}</blockquote>`; i++; continue; }
    const para = [];
    while (i < lignes.length && lignes[i].trim() && !/^(#{1,4}\s|\s*([-*•]|\d+[.)])\s+|\s*\||>)/.test(lignes[i])) { para.push(inline(lignes[i])); i++; }
    if (para.length) html += `<p>${para.join('<br>')}</p>`; else { html += `<p>${inline(l)}</p>`; i++; }
  }
  return html;
}
const bas = () => { zone.scrollTop = zone.scrollHeight; };

fetch('/api/config').then(r => r.json()).then(c => {
  document.getElementById('accueil').innerHTML = rendu(
    `Bonjour, je suis l'assistant virtuel de **${c.conseiller}** (SGO IMMO). Je suis une IA : ` +
    `je peux analyser les chiffres de votre opération avec notre modèle de bilan, relire la logique ` +
    `de votre promesse ou de votre financement, et vous aider à choisir votre stratégie de sortie.\n\n` +
    `Pour un avis engageant sur un dossier réel, ${c.conseiller} reprend la main.`);
}).catch(() => {});

function bulle(classe, html) {
  const d = document.createElement('div');
  d.className = 'msg ' + classe; d.innerHTML = html; fil.appendChild(d); bas(); return d;
}

async function envoyer(texte) {
  texte = texte.trim(); if (!texte) return;
  document.getElementById('suggestions')?.remove();
  const c = bulle('client', ''); c.textContent = texte;
  saisie.value = ''; bouton.disabled = true; saisie.disabled = true;
  const rep = bulle('assistant', '<span class="status">Réflexion…</span>');
  let md = '';
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: texte, conversation_id: conversationId }) });
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || 'Erreur ' + r.status); }
    const lecteur = r.body.getReader(), dec = new TextDecoder(); let tampon = '';
    while (true) {
      const { value, done } = await lecteur.read(); if (done) break;
      tampon += dec.decode(value, { stream: true });
      let i;
      while ((i = tampon.indexOf('\n\n')) >= 0) {
        const bloc = tampon.slice(0, i); tampon = tampon.slice(i + 2);
        if (!bloc.startsWith('data: ')) continue;
        const evt = JSON.parse(bloc.slice(6));
        if (evt.type === 'conversation') { conversationId = evt.id; try { sessionStorage.setItem('sgo_conv', evt.id); } catch (e) {} }
        else if (evt.type === 'text') { md += evt.text; rep.innerHTML = rendu(md); }
        else if (evt.type === 'status') { rep.innerHTML = rendu(md) + `<p class="status">${evt.text}</p>`; }
        else if (evt.type === 'error') { rep.innerHTML = rendu(md) + `<p class="erreur"></p>`; rep.lastChild.textContent = evt.text; }
        bas();
      }
    }
  } catch (e) {
    rep.innerHTML = '<p class="erreur"></p>'; rep.firstChild.textContent = e.message;
  } finally {
    bouton.disabled = false; saisie.disabled = false; saisie.focus();
  }
}

document.getElementById('formulaire').addEventListener('submit', (e) => { e.preventDefault(); envoyer(saisie.value); });
saisie.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); envoyer(saisie.value); } });
document.querySelectorAll('.suggestions button').forEach(b => b.addEventListener('click', () => envoyer(b.textContent)));
</script>
</body>
</html>
