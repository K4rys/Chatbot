<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connexion · Pilotage MDB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap">
<style>
:root { --bg: #f4f6f9; --surface: #fff; --line: #b7c0cf; --fg: #18202d; --fg-3: #6b7587; --accent: #23508f; --accent-fg: #fff; --crit: #b4232c; --crit-soft: #fbe6e7; color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (prefers-color-scheme: dark) { :root { --bg: #10151d; --surface: #171e29; --line: #3d4a5e; --fg: #e6eaf1; --fg-3: #8590a2; --accent: #8fb3ec; --accent-fg: #0f1724; --crit: #f08c8f; --crit-soft: #3d1d22; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 "IBM Plex Sans", system-ui, sans-serif; display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { width: min(380px, 100%); display: grid; gap: 18px; }
h1 { font-family: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; font-size: 28px; margin: 0; }
p { margin: 0; color: var(--fg-3); }
form { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; display: grid; gap: 14px; }
label { display: grid; gap: 5px; font-size: 13px; font-weight: 500; }
input { font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; font-weight: 600; padding: 11px; border: 0; border-radius: 6px; background: var(--accent); color: var(--accent-fg); cursor: pointer; }
button[disabled] { opacity: .6; }
.err { background: var(--crit-soft); color: var(--crit); border-radius: 6px; padding: 8px 10px; font-size: 14px; }
.note { font-size: 12.5px; }
</style>
</head>
<body>
<main>
  <div><h1>Pilotage MDB</h1><p>Suivi des opérations de marchand de biens</p></div>
  <form id="f" autocomplete="on">
    <label for="login">Identifiant<input id="login" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label for="mdp">Mot de passe<input id="mdp" name="password" type="password" autocomplete="current-password" required></label>
    <div class="err" id="err" hidden></div>
    <button id="ok" type="submit">Se connecter</button>
  </form>
  <p class="note">Accès réservé. Les comptes sont créés par l'administrateur. Sur téléphone, ajoutez la page à l'écran d'accueil pour l'utiliser comme une application.</p>
</main>
<script>
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("err"), ok = document.getElementById("ok");
  err.hidden = true; ok.disabled = true; ok.textContent = "Connexion…";
  try {
    const r = await fetch("/api/pilotage/connexion", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin",
      body: JSON.stringify({ login: document.getElementById("login").value, mdp: document.getElementById("mdp").value }) });
    if (r.ok) { location.replace("/pilotage"); return; }
    const d = await r.json().catch(() => ({}));
    err.textContent = d.error || "Connexion impossible."; err.hidden = false;
  } catch (x) { err.textContent = "Serveur injoignable : vérifiez votre connexion internet."; err.hidden = false; }
  ok.disabled = false; ok.textContent = "Se connecter";
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/pilotage/sw.js", { scope: "/pilotage" }).catch(() => {});
</script>
</body>
</html>
